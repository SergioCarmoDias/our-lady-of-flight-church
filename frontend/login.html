<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Our Lady of Flight Church</title>
    <link rel="stylesheet" href="./css/login.css">
    <script src="./js/main.js" defer></script>
</head>
<body>

    <div class="login-card">
        <h2>Admin Portal</h2>
        <p>Our Lady of Flight Church</p>
        
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter admin username" required autocomplete="username">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div id="error-msg"></div>
        
        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            errorMsg.textContent = '';

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save JWT token so frontend edit components know user is authenticated
                    localStorage.setItem('adminToken', data.token);
                    // Redirect back to main page or admin view
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = data.message || 'Invalid login credentials.';
                }
            } catch (err) {
                errorMsg.textContent = 'Unable to connect to the server. Try again later.';
            }
        });
    </script>
</body>
</html>
